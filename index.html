<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタンプ企画室 Ver.0.2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#383b42;background:#f5eee5}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:#777;font-size:12px}.panel{background:#fffdf9;border:2px solid #d8cbbb;border-radius:16px;padding:15px;margin:14px 0;box-shadow:0 3px 0 #e6d9ca}button{border:0;background:#637d78;color:white;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}button.secondary{background:#e8e1d7;color:#45423d}button.warn{background:#a76562}input,textarea,select{width:100%;padding:11px;border:1px solid #d5c9ba;border-radius:9px;font:inherit;background:white}textarea{min-height:85px}label{font-size:13px;font-weight:700;display:block;margin:9px 0 5px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.office{position:relative;height:245px;overflow:hidden;border:6px solid #967e69;border-radius:12px;background:repeating-linear-gradient(0deg,transparent 0 38px,#d0b99e 39px 40px),repeating-linear-gradient(90deg,#e2c9a8 0 38px,#d0b99e 39px 40px);image-rendering:pixelated}.desk{position:absolute;width:72px;height:44px;background:#a67e5c;border:5px solid #765a46;border-radius:4px;top:50px}.desk:before{content:'▣';position:absolute;top:-22px;left:23px;background:#536a72;color:#b6d4d0;border:3px solid #394b52;padding:2px 5px}.avatar{position:absolute;top:140px;font-size:35px;transition:left .8s,top .8s;filter:drop-shadow(2px 4px 0 #9e8b76);cursor:pointer}.avatar small{display:block;font-size:11px;background:#fff8e9;border-radius:6px;text-align:center;font-weight:bold}.bubble{position:absolute;bottom:6px;left:8px;right:8px;background:#fffaf0;border:2px solid #aa9079;border-radius:9px;padding:7px;font-size:12px}.talk{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #e9e2d8;padding:12px 0}.face{font-size:30px;min-width:40px}.talk p{margin:4px 0 0;line-height:1.55}.tag{font-size:11px;background:#ede8df;padding:3px 7px;border-radius:30px}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.idea{border:1px solid #e1d8cd;border-radius:10px;padding:12px;margin:8px 0}footer{font-size:11px;color:#777;text-align:center;padding:20px}
</style></head><body><main><div class="row"><div><h1>🎮 スタンプ企画室</h1><div class="muted">Ver.0.2 ・ LINEスタンプ・絵文字の企画専門</div></div><div>🪙 <b id="coins">0</b></div></div><section class="panel"><h2>🏢 みんなの編集部</h2><div class="office"><div class="desk" style="left:8%"></div><div class="desk" style="left:39%"></div><div class="desk" style="left:70%"></div><div class="avatar" id="hinako" style="left:12%" onclick="chat('hinako')">👩🏻‍💻<small>ひなこ</small></div><div class="avatar" id="pushi" style="left:43%" onclick="chat('pushi')">🐱<small>ぷし</small></div><div class="avatar" id="daijiro" style="left:74%" onclick="chat('daijiro')">🐻<small>だいじろう課長</small></div><div class="bubble" id="officeMsg">社員をタップするとオフの雑談ができるよ ☕</div></div></section><section class="panel"><h2>💡 新しい企画会議</h2><label for="theme">考えたいテーマ（空欄でもOK）</label><input id="theme" placeholder="例：仕事で使えるクセ強めの動物スタンプ"><label for="target">想定する使い手</label><input id="target" placeholder="例：職場の同僚、家族、ママ友"><div class="buttons"><button onclick="startMeeting()">3人で企画会議！</button><button class="secondary" onclick="randomTheme()">お題をおまかせ 🎲</button></div><div id="meeting" class="hidden"><h2 style="margin-top:20px">🗣️ 会議室</h2><div id="discussion" aria-live="polite"></div><p id="meetingHint" class="muted">会話を進めると社員同士の議論が深まるよ。</p><div class="buttons"><button class="secondary" onclick="moreDebate()">もっと議論</button><button class="secondary" onclick="copyPrompt()">AI会議の指示文をコピー</button><button class="secondary" onclick="nextLine()">会話を1つ進める ▶</button></div><label for="result">ChatGPTの企画案・会議結果を貼り付け</label><textarea id="result" placeholder="ChatGPTから返ってきた企画案をここに貼り付けて保存"></textarea><div class="buttons"><button onclick="saveIdea('採用')">採用して保存</button><button class="secondary" onclick="saveIdea('保留')">保留で保存</button><button class="warn" onclick="saveIdea('ボツ')">ボツ案として保存</button></div></div></section><section class="panel"><h2>📚 企画保管庫 <span id="count" class="tag">0件</span></h2><div id="ideas"></div><div class="buttons"><button class="secondary" onclick="exportData()">バックアップ保存 ↓</button><button class="secondary" onclick="document.getElementById('importFile').click()">バックアップ復元 ↑</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></div></section><section class="panel"><h2>🤝 社員との信頼度</h2><div id="trust"></div><p class="muted">会議に参加すると少しずつ信頼度が上昇。仕事中の性格は変わらず、オフの会話が解放される。</p></section><footer>データはこのブラウザ内に保存されます。端末変更やブラウザデータ削除に備え、重要な企画は別途コピーしてください。</footer></main><script>
const names={hinako:'ひなこ',pushi:'ぷし',daijiro:'だいじろう課長'},faces={hinako:'👩🏻‍💻',pushi:'🐱',daijiro:'🐻'};const storeKey='stamp-editor-v01';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{coins:0,ideas:[],trust:{hinako:0,pushi:0,daijiro:0}}}catch(e){state={coins:0,ideas:[],trust:{hinako:0,pushi:0,daijiro:0}}}let current='',round=0,dialogue=[],dialogueIndex=0;const topics=['ちょっと言いづらいお願い','仕事中の本音を伝える動物','送迎や待ち合わせで使う短い連絡','疲れた日のゆるい返事','年末年始の会社員あるある'];function persist(){localStorage.setItem(storeKey,JSON.stringify(state));render()}function randomTheme(){document.getElementById('theme').value=topics[Math.floor(Math.random()*topics.length)]}function say(id,msg){return `<div class="talk"><div class="face">${faces[id]}</div><div><b>${names[id]}</b> <span class="tag">${id==='hinako'?'前向き':id==='pushi'?'分析派':'辛口'}</span><p>${msg}</p></div></div>`}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function makeDialogue(theme,target){const t=safe(theme),who=safe(target||'使う人');return [
 ['hinako',`「${t}」！まず、${who}が思わず送りたくなる場面を考えたいな。`],
 ['daijiro','待て。テーマだけで盛り上がるな。誰がいつ送るんだ？'],
 ['pushi',`課長の指摘は妥当ですね。${who}が「短く伝えたい瞬間」を先に3つ出しましょう。`],
 ['hinako','じゃあ、相手に気を遣う返事、予定の確認、気まずい時のひと言はどう？'],
 ['daijiro','その3つ、バラバラすぎる。買う理由がぼやけるぞ。ひとつに絞れ。'],
 ['pushi','では「誰に・いつ・何を伝えるか」が共通する場面に限定しましょう。セリフの重複も減ります。'],
 ['hinako','なるほど！用途を絞れば、見た目にも統一感が出せそう。'],
 ['daijiro','まだ採用じゃねえ。24個分の使える文言を考えてから判断だ。'],
 ['pushi','競合作品の数や売上は未調査です。実際の販売可能性は別途確認が必要ですね。']
]}
function showLines(n){let out='';for(let i=0;i<n;i++)out+=say(dialogue[i][0],dialogue[i][1]);document.getElementById('discussion').innerHTML=out;document.getElementById('meetingHint').textContent=n<dialogue.length?`会議進行 ${n}/${dialogue.length} 発言。続きを見るには「会話を1つ進める」。`:'会議は一区切り。さらに議論するか、ChatGPTで本格的な企画を作ろう。'}
function startMeeting(){current=document.getElementById('theme').value.trim()||topics[Math.floor(Math.random()*topics.length)];document.getElementById('theme').value=current;round=0;dialogue=makeDialogue(current,document.getElementById('target').value.trim());dialogueIndex=3;document.getElementById('meeting').classList.remove('hidden');document.getElementById('result').value='';showLines(dialogueIndex);for(const id of Object.keys(names))state.trust[id]++;document.getElementById('officeMsg').textContent='会議中！社員たちの意見がぶつかっています。';persist();document.getElementById('meeting').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nextLine(){if(!current)return;if(dialogueIndex<dialogue.length){dialogueIndex++;showLines(dialogueIndex)}else{moreDebate()}}
function moreDebate(){if(!current)return;round++;const extra=[
 [['hinako','じゃあ、短いセリフだけにして使いやすさを優先するのは？'],['pushi','よい方向ですが、絵文字とスタンプでは必要な文字数が違いますね。'],['daijiro','そうだ。どっちを作るか決めないと、また企画が散らかるぞ。']],
 [['daijiro','で、既存の作品との違いは？ まだ説明できねえだろ。'],['hinako','じゃあ「使う場面」をひとつに絞って、そこでしか使えない表現を探そう！'],['pushi','差別化は仮説として整理しましょう。競合調査なしで「唯一」とは言えません。']]
][(round-1)%2];dialogue.push(...extra);dialogueIndex=dialogue.length;showLines(dialogueIndex)}
function promptText(){return `あなたはLINEスタンプ・絵文字の企画編集部です。以下のテーマについて、社員同士が相手の意見を受けて反論・改善する自然な企画会議を行い、実際に制作する価値のある企画を3案提案してください。\nテーマ：${current}\n想定購入者：${document.getElementById('target').value||'未指定。合理的に仮設定してください'}\nひなこ：明るく可能性を探す。ただし無条件に賛成しない。\nぷし：冷静な中立派。利用場面や根拠を検討する。\nだいじろう課長：口が悪めの辛口派。企画の弱点を鋭く指摘するが、良い案は認める。\n賛否を固定せず、具体的な議論をしてください。市場調査をしていない場合、売れ筋・競合の主張を事実として扱わないでください。\n企画会議は最低8往復、台本調でなく論点が進む会話にしてください。最後に各案について、作品名、購入者、利用場面、差別化仮説、セリフ例8個（絵文字なら短い表現）、懸念点、推奨度を示してください。実体験は創作しないでください。` }async function copyPrompt(){const s=promptText();try{await navigator.clipboard.writeText(s);alert('コピーしたよ！ChatGPTに貼り付けてね。')}catch(e){prompt('指示文をコピーしてね',s)}}function saveIdea(status){if(!current)return;state.ideas.unshift({id:Date.now(),theme:current,target:document.getElementById('target').value,result:document.getElementById('result').value,status,date:new Date().toLocaleDateString('ja-JP')});state.coins+=status==='採用'?30:10;persist();document.getElementById('officeMsg').textContent=`「${current}」を${status}として保存したよ！`;alert(`${status}として保存しました！`)}function chat(id){const t=state.trust[id]||0;const lines={hinako:t>=3?'昨日カフェに行こうとして、逆方向の電車に乗っちゃった！': 'お疲れさま！今日もお茶飲んでがんばろう！',pushi:t>=3?'実は卵焼きの焼き加減を17回検証しているんです。':'休憩中です。何か飲みますか？',daijiro:t>=3?'昨日プリンが半額だったんだ。……何だ、その顔は。':'仕事が終わったなら休め。無理してもいい案は出ねえぞ。'};document.getElementById('officeMsg').textContent=`${names[id]}：${lines[id]}` }function exportData(){const blob=new Blob([JSON.stringify({app:'stamp-kikakushitsu',version:2,state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stamp-kikakushitsu-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='stamp-kikakushitsu'||!obj.state||!Array.isArray(obj.state.ideas)||!obj.state.trust)throw Error('形式が違います');if(!confirm('現在の企画と信頼度をバックアップの内容で上書きします。続けますか？'))return;state=obj.state;persist();alert('復元したよ！')}catch(err){alert('バックアップを読み込めませんでした：'+err.message)}e.target.value=''}
function render(){document.getElementById('coins').textContent=state.coins;document.getElementById('count').textContent=state.ideas.length+'件';document.getElementById('trust').innerHTML=Object.keys(names).map(id=>`<div class="row" style="margin:8px 0"><span>${faces[id]} ${names[id]}</span><span class="tag">信頼度 ${state.trust[id]||0} ${state.trust[id]>=3?'☕ 雑談解放':''}</span></div>`).join('');document.getElementById('ideas').innerHTML=state.ideas.length?state.ideas.map(x=>`<div class="idea"><div class="row"><b>${safe(x.theme)}</b><span class="tag">${x.status}</span></div><div class="muted">${x.date} ・ ${safe(x.target||'対象未設定')}</div>${x.result?`<p style="white-space:pre-wrap;font-size:13px">${safe(x.result)}</p>`:''}<div class="buttons"><button class="secondary" onclick="reuse(${x.id})">再検討</button><button class="secondary" onclick="copyIdea(${x.id})">コピー</button></div></div>`).join(''):'<p class="muted">まだ企画はありません。最初の会議を開いてみよう！</p>'}function reuse(id){const x=state.ideas.find(x=>x.id===id);if(!x)return;document.getElementById('theme').value=x.theme;document.getElementById('target').value=x.target;startMeeting();document.getElementById('result').value=x.result}async function copyIdea(id){const x=state.ideas.find(x=>x.id===id);if(!x)return;const txt=`${x.theme}\n${x.status}\n${x.result}`;try{await navigator.clipboard.writeText(txt);alert('コピーしたよ！')}catch(e){prompt('コピーしてね',txt)}}render();setInterval(()=>{for(const id of Object.keys(names)){const el=document.getElementById(id);if(Math.random()<.45){el.style.top=(118+Math.random()*32)+'px';el.style.left=({hinako:8,pushi:38,daijiro:69}[id]+Math.random()*13)+'%'}}},2400);
</script></body></html>
