<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタンプ企画室 Ver.0.1</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#383b42;background:#f5eee5}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:#777;font-size:12px}.panel{background:#fffdf9;border:2px solid #d8cbbb;border-radius:16px;padding:15px;margin:14px 0;box-shadow:0 3px 0 #e6d9ca}button{border:0;background:#637d78;color:white;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}button.secondary{background:#e8e1d7;color:#45423d}button.warn{background:#a76562}input,textarea,select{width:100%;padding:11px;border:1px solid #d5c9ba;border-radius:9px;font:inherit;background:white}textarea{min-height:85px}label{font-size:13px;font-weight:700;display:block;margin:9px 0 5px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.office{position:relative;height:245px;overflow:hidden;border:6px solid #967e69;border-radius:12px;background:repeating-linear-gradient(0deg,transparent 0 38px,#d0b99e 39px 40px),repeating-linear-gradient(90deg,#e2c9a8 0 38px,#d0b99e 39px 40px);image-rendering:pixelated}.desk{position:absolute;width:72px;height:44px;background:#a67e5c;border:5px solid #765a46;border-radius:4px;top:50px}.desk:before{content:'▣';position:absolute;top:-22px;left:23px;background:#536a72;color:#b6d4d0;border:3px solid #394b52;padding:2px 5px}.avatar{position:absolute;top:140px;font-size:35px;transition:left .8s,top .8s;filter:drop-shadow(2px 4px 0 #9e8b76);cursor:pointer}.avatar small{display:block;font-size:11px;background:#fff8e9;border-radius:6px;text-align:center;font-weight:bold}.bubble{position:absolute;bottom:6px;left:8px;right:8px;background:#fffaf0;border:2px solid #aa9079;border-radius:9px;padding:7px;font-size:12px}.talk{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #e9e2d8;padding:12px 0}.face{font-size:30px;min-width:40px}.talk p{margin:4px 0 0;line-height:1.55}.tag{font-size:11px;background:#ede8df;padding:3px 7px;border-radius:30px}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.idea{border:1px solid #e1d8cd;border-radius:10px;padding:12px;margin:8px 0}footer{font-size:11px;color:#777;text-align:center;padding:20px}
</style></head><body><main><div class="row"><div><h1>🎮 スタンプ企画室</h1><div class="muted">Ver.0.1 ・ LINEスタンプ企画専門</div></div><div>🪙 <b id="coins">0</b></div></div><section class="panel"><h2>🏢 みんなの編集部</h2><div class="office"><div class="desk" style="left:8%"></div><div class="desk" style="left:39%"></div><div class="desk" style="left:70%"></div><div class="avatar" id="hinako" style="left:12%" onclick="chat('hinako')">👩🏻‍💻<small>ひなこ</small></div><div class="avatar" id="pushi" style="left:43%" onclick="chat('pushi')">🐱<small>ぷし</small></div><div class="avatar" id="daijiro" style="left:74%" onclick="chat('daijiro')">🐻<small>だいじろう課長</small></div><div class="bubble" id="officeMsg">社員をタップすると雑談できるよ ☕</div></div></section><section class="panel"><h2>💡 新しい企画会議</h2><label for="theme">考えたいテーマ（空欄でもOK）</label><input id="theme" placeholder="例：仕事で使えるクセ強めの動物スタンプ"><label for="target">想定する使い手</label><input id="target" placeholder="例：職場の同僚、家族、ママ友"><div class="buttons"><button onclick="startMeeting()">3人で企画会議！</button><button class="secondary" onclick="randomTheme()">お題をおまかせ 🎲</button></div><div id="meeting" class="hidden"><h2 style="margin-top:20px">🗣️ 会議室</h2><div id="discussion"></div><div class="buttons"><button class="secondary" onclick="moreDebate()">もっと議論</button><button class="secondary" onclick="copyPrompt()">ChatGPT用指示文をコピー</button></div><label for="result">ChatGPTの企画案・会議結果を貼り付け</label><textarea id="result" placeholder="ChatGPTから返ってきた企画案をここに貼り付けて保存"></textarea><div class="buttons"><button onclick="saveIdea('採用')">採用して保存</button><button class="secondary" onclick="saveIdea('保留')">保留で保存</button><button class="warn" onclick="saveIdea('ボツ')">ボツ案として保存</button></div></div></section><section class="panel"><h2>📚 企画保管庫 <span id="count" class="tag">0件</span></h2><div id="ideas"></div></section><section class="panel"><h2>🤝 社員との信頼度</h2><div id="trust"></div><p class="muted">会議に参加すると少しずつ信頼度が上昇。仕事中の性格は変わらず、オフの会話が解放される。</p></section><footer>データはこのブラウザ内に保存されます。端末変更やブラウザデータ削除に備え、重要な企画は別途コピーしてください。</footer></main><script>
const names={hinako:'ひなこ',pushi:'ぷし',daijiro:'だいじろう課長'},faces={hinako:'👩🏻‍💻',pushi:'🐱',daijiro:'🐻'};const storeKey='stamp-editor-v01';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{coins:0,ideas:[],trust:{hinako:0,pushi:0,daijiro:0}}}catch(e){state={coins:0,ideas:[],trust:{hinako:0,pushi:0,daijiro:0}}}let current='',round=0;const topics=['ちょっと言いづらいお願い','仕事中の本音を伝える動物','送迎や待ち合わせで使う短い連絡','疲れた日のゆるい返事','年末年始の会社員あるある'];function persist(){localStorage.setItem(storeKey,JSON.stringify(state));render()}function randomTheme(){document.getElementById('theme').value=topics[Math.floor(Math.random()*topics.length)]}function say(id,msg){return `<div class="talk"><div class="face">${faces[id]}</div><div><b>${names[id]}</b> <span class="tag">${id==='hinako'?'前向き':id==='pushi'?'分析派':'辛口'}</span><p>${msg}</p></div></div>`}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startMeeting(){current=document.getElementById('theme').value.trim()||topics[Math.floor(Math.random()*topics.length)];document.getElementById('theme').value=current;round=0;document.getElementById('meeting').classList.remove('hidden');document.getElementById('discussion').innerHTML=say('hinako',`「${safe(current)}」！いいね！どんな場面で送るかを考えると広がりそう！`)+say('pushi','まず誰が、誰に、いつ使うのかを決めたいですね。競合作品の実態はまだ調べていません。')+say('daijiro','待て。面白いだけじゃ買われないぞ。既存のスタンプと何が違う？そこを説明してみろ。');for(const id of Object.keys(names))state.trust[id]++;document.getElementById('officeMsg').textContent='企画会議中！3人がそれぞれの立場から検討しています。';persist();document.getElementById('meeting').scrollIntoView({behavior:'smooth',block:'nearest'})}function moreDebate(){if(!current)return;round++;const lines=[['使う人の困りごとをもっと具体的にしたら、良い企画になりそう！','日常的に何回使うか、セリフが重複しないか確認しましょう。','24個並べるだけで息切れする企画ならやめとけ。使えるセリフを先に出せ。'],['かわいいだけじゃなく、送る理由があるといいよね！','候補を3案に分けて比較するのが妥当ですね。','反論が嫌なら会議は終わりだ。弱点を潰してから採用しろ。']][(round-1)%2];document.getElementById('discussion').innerHTML+=say('hinako',lines[0])+say('pushi',lines[1])+say('daijiro',lines[2])}function promptText(){return `あなたはLINEスタンプの企画編集部です。以下のテーマについて、3人の個性を保った企画会議を行い、実際に制作する価値のある企画を3案提案してください。\nテーマ：${current}\n想定購入者：${document.getElementById('target').value||'未指定。合理的に仮設定してください'}\nひなこ：明るく可能性を探す。ただし無条件に賛成しない。\nぷし：冷静な中立派。利用場面や根拠を検討する。\nだいじろう課長：口が悪めの辛口派。企画の弱点を鋭く指摘するが、良い案は認める。\n賛否を固定せず、具体的な議論をしてください。市場調査をしていない場合、売れ筋・競合の主張を事実として扱わないでください。\n最後に各案について、作品名、購入者、利用場面、差別化仮説、セリフ例8個、懸念点、推奨度を示してください。実体験は創作しないでください。` }async function copyPrompt(){const s=promptText();try{await navigator.clipboard.writeText(s);alert('コピーしたよ！ChatGPTに貼り付けてね。')}catch(e){prompt('指示文をコピーしてね',s)}}function saveIdea(status){if(!current)return;state.ideas.unshift({id:Date.now(),theme:current,target:document.getElementById('target').value,result:document.getElementById('result').value,status,date:new Date().toLocaleDateString('ja-JP')});state.coins+=status==='採用'?30:10;persist();document.getElementById('officeMsg').textContent=`「${current}」を${status}として保存したよ！`;alert(`${status}として保存しました！`)}function chat(id){const t=state.trust[id]||0;const lines={hinako:t>=3?'昨日カフェに行こうとして、逆方向の電車に乗っちゃった！': 'お疲れさま！今日もお茶飲んでがんばろう！',pushi:t>=3?'実は卵焼きの焼き加減を17回検証しているんです。':'休憩中です。何か飲みますか？',daijiro:t>=3?'昨日プリンが半額だったんだ。……何だ、その顔は。':'仕事が終わったなら休め。無理してもいい案は出ねえぞ。'};document.getElementById('officeMsg').textContent=`${names[id]}：${lines[id]}` }function render(){document.getElementById('coins').textContent=state.coins;document.getElementById('count').textContent=state.ideas.length+'件';document.getElementById('trust').innerHTML=Object.keys(names).map(id=>`<div class="row" style="margin:8px 0"><span>${faces[id]} ${names[id]}</span><span class="tag">信頼度 ${state.trust[id]||0} ${state.trust[id]>=3?'☕ 雑談解放':''}</span></div>`).join('');document.getElementById('ideas').innerHTML=state.ideas.length?state.ideas.map(x=>`<div class="idea"><div class="row"><b>${safe(x.theme)}</b><span class="tag">${x.status}</span></div><div class="muted">${x.date} ・ ${safe(x.target||'対象未設定')}</div>${x.result?`<p style="white-space:pre-wrap;font-size:13px">${safe(x.result)}</p>`:''}<div class="buttons"><button class="secondary" onclick="reuse(${x.id})">再検討</button><button class="secondary" onclick="copyIdea(${x.id})">コピー</button></div></div>`).join(''):'<p class="muted">まだ企画はありません。最初の会議を開いてみよう！</p>'}function reuse(id){const x=state.ideas.find(x=>x.id===id);if(!x)return;document.getElementById('theme').value=x.theme;document.getElementById('target').value=x.target;startMeeting();document.getElementById('result').value=x.result}async function copyIdea(id){const x=state.ideas.find(x=>x.id===id);if(!x)return;const txt=`${x.theme}\n${x.status}\n${x.result}`;try{await navigator.clipboard.writeText(txt);alert('コピーしたよ！')}catch(e){prompt('コピーしてね',txt)}}render();setInterval(()=>{for(const id of Object.keys(names)){const el=document.getElementById(id);if(Math.random()<.45){el.style.top=(118+Math.random()*32)+'px';el.style.left=({hinako:8,pushi:38,daijiro:69}[id]+Math.random()*13)+'%'}}},2400);
</script></body></html>
